<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Power Tag</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9bd49b;font-family:Arial,sans-serif;color:white}canvas{display:block}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07130bcc;z-index:20}.panel{width:min(90vw,520px);padding:30px;border-radius:22px;background:#18301eee;text-align:center;box-shadow:0 20px 70px #0008}h1{font-size:42px;margin:0 0 8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}button,input{width:100%;box-sizing:border-box;padding:15px;border:0;border-radius:12px;font-size:16px;font-weight:800}button{background:#65e56e;color:#08210b;cursor:pointer}button:hover{transform:scale(1.02)}.secondary{background:#334d39;color:white}.full{grid-column:1/-1}input{background:#09150d;color:white;border:1px solid #ffffff33}.hidden{display:none!important}.hud{position:fixed;inset:0;z-index:10;pointer-events:none}.hudbox{position:absolute;top:15px;padding:12px 15px;border-radius:12px;background:#07130dcc}.left{left:15px}.right{right:15px;text-align:right}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 3px 15px #000}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{width:12px;height:2px;top:5px}.cross:after{width:2px;height:12px;left:5px}@media(max-width:650px){.buttons{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="menu" class="screen"><div class="panel"><h1>POWER TAG 🦍</h1><p>3D jungle tag • parkour • powers</p><input id="name" value="Player" maxlength="14" placeholder="Your name"><div class="buttons"><button id="practice">PRACTICE VS BOT</button><button id="create">CREATE ROOM</button><button id="join">JOIN ROOM</button><input id="room" class="full" maxlength="6" placeholder="Room code"></div><p>WASD move • mouse look • SPACE jump • SHIFT dash • Q ghost</p><div id="msg"></div></div></div><div id="lobby" class="screen hidden"><div class="panel"><h2>ROOM CREATED 🦍</h2><div id="code" style="font-size:36px;letter-spacing:8px;margin:18px;color:#65e56e">------</div><p id="players">1/8 players</p><button id="start">START MATCH</button><br><br><button id="back" class="secondary">BACK</button></div></div><div id="hud" class="hud hidden"><div class="hudbox left">POWER TAG 🦍<br><span id="status">READY</span><br><small>⚡ <span id="dash">READY</span> • 👻 <span id="ghost">READY</span></small></div><div class="hudbox right">TIME: <span id="time">90</span><br><span id="it">IT: ???</span></div><div id="center" class="center"></div><div class="cross"></div></div><div id="end" class="screen hidden"><div class="panel"><h2>ROUND OVER</h2><p id="endtext"></p><button id="again">PLAY AGAIN</button><br><br><button id="menuBtn" class="secondary">MENU</button></div></div><script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script><script>(function(){'use strict';var $=function(id){return document.getElementById(id)};var scene,camera,renderer,mode='';var players={},me='me',active=false,it='';var keys={},yaw=0,pitch=0,vy=0,y=1.5,startTime=0;var obstacles=[];var speed=8;var spawn=[[0,0,12],[10,0,8],[-10,0,8],[15,0,-5],[-15,0,-5],[0,0,-15]];function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function message(t){$('msg').textContent=t;setTimeout(function(){if($('msg').textContent===t)$('msg').textContent=''},1500)}function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd49b);scene.fog=new THREE.Fog(0x9bd49b,35,90);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,140);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaffea,0x294d2b,1.8));var sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(-20,35,15);scene.add(sun);var floor=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x3d7739}));floor.rotation.x=-Math.PI/2;scene.add(floor);for(var i=0;i<30;i++){var tx=(Math.random()-.5)*85,tz=(Math.random()-.5)*85;var tr=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,5,8),new THREE.MeshStandardMaterial({color:0x70492d}));tr.position.set(tx,2.5,tz);scene.add(tr);var top=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,8),new THREE.MeshStandardMaterial({color:0x21602c}));top.position.set(tx,6,tz);scene.add(top)}var obs=[[0,2,0,5,4,5],[-12,2,0,4,4,9],[12,2,0,4,4,9],[0,2,-13,10,4,3],[0,2,13,10,4,3]];obs.forEach(function(a){var m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),new THREE.MeshStandardMaterial({color:0x775633}));m.position.set(a[0],a[1],a[2]);scene.add(m);obstacles.push({x:a[0],z:a[2],w:a[3],d:a[5]})});window.addEventListener('resize',resize);document.addEventListener('keydown',keydown);document.addEventListener('keyup',function(e){keys[e.code]=false});document.addEventListener('mousemove',function(e){if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch))}});renderer.domElement.addEventListener('click',function(){if(active)renderer.domElement.requestPointerLock()});loop()}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function keydown(e){keys[e.code]=true;if(e.code==='Space')e.preventDefault();if(!active)return;if(e.code==='ShiftLeft'||e.code==='ShiftRight')dash();if(e.code==='KeyQ')ghost()}function blocked(x,z){if(x<-48||x>48||z<-48||z>48)return true;for(var i=0;i<obstacles.length;i++){var o=obstacles[i];if(Math.abs(x-o.x)<o.w/2+.7&&Math.abs(z-o.z)<o.d/2+.7)return true}return false}function move(dx,dz){if(!blocked(camera.position.x+dx,camera.position.z))camera.position.x+=dx;if(!blocked(camera.position.x,camera.position.z+dz))camera.position.z+=dz}function addPlayer(id,name,color,bot){var p={id:id,name:name||'Player',x:spawn[Object.keys(players).length%spawn.length][0],z:spawn[Object.keys(players).length%spawn.length][2],color:color||0xff6b6b,bot:!!bot,it:false,ghost:0,dash:0,score:0};players[id]=p;return p}function startGame(practice){mode=practice?'practice':'room';hide('menu');hide('lobby');show('hud');players={};addPlayer(me,$('name').value,0x65e56e,false);if(practice)addPlayer('bot','SMART BOT',0xff5577,true);var ids=Object.keys(players);it=ids[Math.floor(Math.random()*ids.length)];ids.forEach(function(id){players[id].it=id===it;players[id].ghost=0;players[id].score=0});camera.position.set(players[me].x,1.5,players[me].z);active=true;startTime=performance.now();$('status').textContent='RUN!';$('it').textContent='IT: '+players[it].name;message(players[it].name+' IS IT!');renderer.domElement.requestPointerLock()}function dash(){var p=players[me];if(!p||performance.now()<p.dash)return;p.dash=performance.now()+1600;var dx=Math.sin(yaw),dz=Math.cos(yaw);move(dx*5,dz*5);$('dash').textContent='COOLDOWN'}function ghost(){var p=players[me];if(!p||performance.now()<p.ghost)return;p.ghost=performance.now()+3000;$('ghost').textContent='ACTIVE'}function update(dt){if(!active)return;var p=players[me];if(!p)return;var dx=(keys.KeyD?1:0)-(keys.KeyA?1:0),dz=(keys.KeyS?1:0)-(keys.KeyW?1:0),d=Math.hypot(dx,dz);if(d){dx/=d;dz/=d;var wx=dx*Math.cos(yaw)-dz*Math.sin(yaw),wz=dx*Math.sin(yaw)+dz*Math.cos(yaw);move(wx*speed*dt,wz*speed*dt);p.x=camera.position.x;p.z=camera.position.z}if(keys.Space&&y<=1.51){vy=9;keys.Space=false}vy-=22*dt;y+=vy*dt;if(y<1.5){y=1.5;vy=0}camera.position.y=y;camera.rotation.set(pitch,yaw,0,'YXZ');if(p.dash<performance.now())$('dash').textContent='READY';if(p.ghost<performance.now())$('ghost').textContent='READY';if(mode==='practice'){var b=players.bot;var ax=p.x-b.x,az=p.z-b.z,dist=Math.hypot(ax,az)||1;if(b.it){b.x+=ax/dist*4*dt;b.z+=az/dist*4*dt}else{var from=b.x-p.x,fz=b.z-p.z,fd=Math.hypot(from,fz)||1;b.x+=from/fd*3.5*dt;b.z+=fz/fd*3.5*dt}if(b.it&&Math.hypot(b.x-p.x,b.z-p.z)<1.7&&p.ghost<performance.now()){b.it=false;p.it=true;it=me;p.score++;message('YOU ARE IT!')}if(p.it&&Math.hypot(b.x-p.x,b.z-p.z)<1.7){p.it=false;b.it=true;it='bot';b.score++;message('BOT IS IT!')}}var cur=players[it];if(cur&&cur.id!==me&&Math.hypot(cur.x-p.x,cur.z-p.z)<1.7&&p.ghost<performance.now()){cur.it=false;p.it=true;it=me;p.score++;message('YOU TAGGED THEM!')}$('it').textContent='IT: '+players[it].name;$('time').textContent=Math.max(0,Math.ceil((90000-(performance.now()-startTime))/1000));if(performance.now()-startTime>=90000){active=false;document.exitPointerLock();$('endtext').textContent=players[me].score+' tags!';show('end')}}function loop(){requestAnimationFrame(loop);var now=performance.now(),dt=Math.min(.033,(now-last)/1000);last=now;update(dt);renderer.render(scene,camera)}var last=performance.now();$('practice').onclick=function(){startGame(true)};$('create').onclick=function(){hide('menu');show('lobby');$('code').textContent=Math.random().toString(36).slice(2,8).toUpperCase();$('players').textContent='1/8 players';message('Room ready')};$('join').onclick=function(){var r=$('room').value.trim().toUpperCase();if(r.length!==6){message('ENTER A 6 CHARACTER ROOM CODE');return}startGame(false)};$('start').onclick=function(){startGame(false)};$('back').onclick=function(){hide('lobby');show('menu')};$('again').onclick=function(){hide('end');startGame(mode==='practice')};$('menuBtn').onclick=function(){hide('end');show('menu');active=false};setup()})();</script></body></html>
