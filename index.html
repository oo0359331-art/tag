<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>POWER TAG</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111e;color:#fff;font:700 15px system-ui}canvas{width:100%;height:100%;display:block}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#020713dd;z-index:5}.panel{width:min(92vw,520px);padding:28px;border:1px solid #ffffff22;border-radius:20px;background:#0d1728}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;padding:14px;border:1px solid #ffffff22;border-radius:12px;font:inherit}input{background:#07111e;color:#fff}.full{grid-column:1/-1}button{background:#61e7ff;color:#03131a;cursor:pointer}.secondary{background:#1b2943;color:#fff}.hidden{display:none!important}.code{font-size:32px;letter-spacing:8px;text-align:center;color:#61e7ff;background:#07111e;padding:12px;border-radius:12px;margin:15px 0}.hud{position:fixed;inset:0;pointer-events:none}.card{position:absolute;top:14px;background:#020713bb;border:1px solid #ffffff18;border-radius:12px;padding:10px}.left{left:14px;width:270px}.right{right:14px;width:220px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:24px;text-shadow:0 4px 20px #000}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:20;background:#000d;padding:10px 15px;border-radius:10px;display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.left,.right{width:210px}}</style></head><body><canvas id=c></canvas><div id=toast class=toast></div>
<div id=menu class=screen><div class=panel><h1>POWER TAG</h1><p>Dash. Ghost. Chase. Survive. 😈</p><input id=name maxlength=14 value=Player placeholder="Your name"><div style=height:10px></div><div class=grid><button id=practice>PRACTICE VS SMART BOT</button><button id=create>CREATE ROOM</button><button id=join>JOIN ROOM</button><input id=room class=full maxlength=6 placeholder="ROOM CODE"></div><p style="opacity:.65;font-size:12px">2–8 players • WASD • SPACE Dash • Q Ghost</p></div></div>
<div id=lobby class="screen hidden"><div class=panel style=text-align:center><h2>ROOM READY</h2><div id=roomCode class=code>------</div><p id=lobbyStatus>1/8 PLAYERS</p><button id=start>START MATCH</button><br><br><button id=back class=secondary>BACK</button></div></div>
<div id=hud class="hud hidden"><div class="card left">MODE: <b id=mode>ONLINE</b><br><small id=status>READY</small><br><br>YOU: <span id=you>Player</span><br><small id=ability>Dash READY • Ghost READY</small></div><div class="card right">TIME: <span id=time>90</span><br><span id=it>IT: ???</span><br><small id=scores></small></div><div id=center class=center></div></div>
<div id=end class="screen hidden"><div class=panel style=text-align:center><h2 id=endTitle>ROUND OVER</h2><p id=endText></p><div id=endScores></div><br><button id=again>PLAY AGAIN</button><br><br><button id=menuBtn class=secondary>MENU</button></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
(()=>{const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d');let W=0,H=0,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const BW=1400,BH=820,ROUND=90000,SPEED=250,keys={},colors=['#61e7ff','#ffd45d','#ff6f8a','#88ff91','#bc9cff','#ffa05e','#6ea7ff','#ff78e8'];
const walls=[{x:110,y:100,w:360,h:35},{x:600,y:90,w:300,h:35},{x:1040,y:120,w:260,h:35},{x:70,y:280,w:260,h:40},{x:420,y:230,w:200,h:40},{x:760,y:250,w:330,h:40},{x:1170,y:300,w:160,h:40},{x:120,y:540,w:300,h:40},{x:500,y:500,w:350,h:40},{x:950,y:550,w:310,h:40},{x:350,y:100,w:40,h:140},{x:720,y:90,w:40,h:130},{x:1090,y:150,w:40,h:150},{x:330,y:410,w:40,h:170},{x:850,y:430,w:40,h:120},{x:1210,y:430,w:40,h:170},{x:600,y:650,w:190,h:35}];
const spawns=[[55,55],[1345,55],[55,765],[1345,765],[560,55],[840,765],[500,400],[900,400]];let players={},me='',host=false,peer=null,conn=null,connections=new Map,inputs=new Map,mode='menu',code='',itId='',startTime=0,active=false,last=performance.now(),net=0;
function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',1800)}function clean(n){return String(n||'Player').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,14)||'Player'}function roomId(x){return'powertag-'+x.toLowerCase()}function newP(id,n,col,bot){let s=spawns[Object.keys(players).length%spawns.length];return{id:id,name:n,color:col,x:s[0],y:s[1],it:false,score:0,ghost:0,dash:0,bot:!!bot,dx:1,dy:0}}
function snap(){let o={};Object.values(players).forEach(p=>o[p.id]={id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,it:p.it,score:p.score||0,ghost:p.ghost>performance.now(),bot:p.bot});return o}function loadSnap(s){players={};Object.values(s||{}).forEach(p=>{let q={...p};q.ghost=p.ghost?performance.now()+300:0;q.dash=0;players[q.id]=q})}
function blocked(x,y,r=17){if(x<r||y<r||x>BW-r||y>BH-r)return true;for(let o of walls){let xx=Math.max(o.x,Math.min(x,o.x+o.w)),yy=Math.max(o.y,Math.min(y,o.y+o.h));if(Math.hypot(x-xx,y-yy)<r)return true}return false}function move(p,x,y){if(!blocked(p.x+x,p.y))p.x+=x;if(!blocked(p.x,p.y+y))p.y+=y}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function broadcast(d){connections.forEach(q=>{if(q.open)try{q.send(d)}catch(e){}})}function lobby(){let n=Object.keys(players).length;$('lobbyStatus').textContent=n+'/8 PLAYERS • '+(active?'MATCH ACTIVE':'WAITING');$('start').disabled=!host||n<2||active}
function reset(){let ids=Object.keys(players);itId=ids[Math.floor(Math.random()*ids.length)];ids.forEach((id,i)=>{let p=players[id],s=spawns[i%spawns.length];p.x=s[0];p.y=s[1];p.it=id===itId;p.ghost=0;p.dash=0});startTime=performance.now();active=true;$('center').textContent=(players[itId]?.name||'PLAYER')+' IS IT!';setTimeout(()=>$('center').textContent='',1100);lobby()}
function cleanup(){try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}connections.forEach(q=>{try{q.close()}catch(e){}});connections.clear();inputs.clear();conn=null;peer=null}
function practice(){cleanup();mode='practice';host=true;me='you';players={};let n=clean($('name').value);players.you=newP('you',n,colors[0],false);players.bot=newP('bot','SMART BOT',colors[2],true);$('mode').textContent='PRACTICE';$('you').textContent=n;hide('menu');hide('end');show('hud');reset()}
function create(){cleanup();mode='online';host=true;code='';for(let i=0;i<6;i++)code+='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)];peer=new Peer(roomId(code));$('status').textContent='CREATING ROOM...';peer.on('open',id=>{me=id;players={};players[id]=newP(id,clean($('name').value),colors[0],false);$('roomCode').textContent=code;hide('menu');show('lobby');$('status').textContent='HOST READY';lobby()});peer.on('connection',hostConn);peer.on('error',()=>{toast('ROOM ERROR');cleanup();hide('lobby');show('menu')})}
function join(){cleanup();mode='online';host=false;code=clean($('room').value).toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('ENTER 6 CHARACTER CODE');return}peer=new Peer();$('status').textContent='CONNECTING...';peer.on('open',id=>{me=id;conn=peer.connect(roomId(code),{reliable:true});conn.on('open',()=>{conn.send({t:'join',name:clean($('name').value)});hide('menu');show('hud');$('mode').textContent='ONLINE';$('you').textContent=clean($('name').value);$('status').textContent='CONNECTED • WAITING'});conn.on('data',guestData);conn.on('close',()=>$('status').textContent='HOST DISCONNECTED')});peer.on('error',()=>toast('COULD NOT JOIN ROOM'))}
function hostConn(q){if(connections.size>=7){q.on('open',()=>q.send({t:'full'}));return}q.on('open',()=>{connections.set(q.peer,q);players[q.peer]=newP(q.peer,'Player',colors[Object.keys(players).length%8],false);q.send({t:'welcome',p:snap(),it:itId,start:startTime,a:active});lobby()});q.on('data',d=>{if(d.t==='join'&&players[q.peer]){players[q.peer].name=clean(d.name);broadcast({t:'players',p:snap()});lobby()}else if(d.t==='input')inputs.set(q.peer,d.a||{});else if(d.t==='ability')ability(players[q.peer],d.k)});q.on('close',()=>{delete players[q.peer];connections.delete(q.peer);inputs.delete(q.peer);broadcast({t:'players',p:snap()});lobby()})}
function guestData(d){if(d.t==='full'){toast('ROOM FULL');cleanup();hide('hud');show('menu')}else if(d.t==='welcome'){loadSnap(d.p);itId=d.it;startTime=d.start;active=d.a}else if(d.t==='players')loadSnap(d.p);else if(d.t==='state'){loadSnap(d.p);itId=d.it;startTime=d.start;active=d.a}else if(d.t==='round'){loadSnap(d.p);itId=d.it;startTime=d.start;active=true}else if(d.t==='end'){loadSnap(d.p);active=false;results(d.text)}}
function ability(p,k){if(!p||!active)return;let now=performance.now();if(k==='dash'&&now>p.dash){move(p,(p.dx||1)*150,(p.dy||0)*150);p.dash=now+1600}else if(k==='ghost'&&now>p.ghost)p.ghost=now+2800}
function bot(p){let target=null,b=1e9;Object.values(players).forEach(q=>{if(q===p)return;if(p.it){if(q.ghost>performance.now())return}else if(!q.it)return;let d=dist(p,q);if(d<b){b=d;target=q}});if(!target)return{up:true};let x=target.x-p.x,y=target.y-p.y,d=Math.hypot(x,y)||1;x/=d;y/=d;if(!p.it){x=-x;y=-y}if(blocked(p.x+x*50,p.y+y*50)){let t=x;x=-y;y=t}p.dx=x;p.dy=y;return{left:x<-.2,right:x>.2,up:y<-.2,down:y>.2}}
function updatePlayer(p,dt){let a=p.bot?bot(p):(inputs.get(p.id)||{}),x=(a.right?1:0)-(a.left?1:0),y=(a.down?1:0)-(a.up?1:0);if(x||y){let d=Math.hypot(x,y);x/=d;y/=d;p.dx=x;p.dy=y;move(p,x*SPEED*dt,y*SPEED*dt)}}function tag(){let t=players[itId];if(!t)return;for(let p of Object.values(players))if(p!==t&&p.ghost<=performance.now()&&dist(t,p)<35){t.it=false;p.it=true;itId=p.id;p.score=(p.score||0)+1;$('center').textContent=p.name+' IS IT!';setTimeout(()=>$('center').textContent='',600);return}}
function results(text){$('endTitle').textContent='ROUND OVER';$('endText').textContent=text;$('endScores').innerHTML=Object.values(players).map(p=>'<div>'+clean(p.name)+' — '+(p.score||0)+'</div>').join('');hide('hud');show('end')}
function startMatch(){if(!host||Object.keys(players).length<2)return;hide('lobby');show('hud');reset();broadcast({t:'round',p:snap(),it:itId,start:startTime})}
function tick(){let n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;if(active){if(host){Object.values(players).forEach(p=>updatePlayer(p,dt));tag();if(n-startTime>=ROUND){active=false;let best=Object.values(players).sort((a,b)=>(b.score||0)-(a.score||0))[0];let text=(best?.name||'Player')+' got the most tags.';broadcast({t:'end',p:snap(),text:text});results(text)}else if(n-net>80){net=n;broadcast({t:'state',p:snap(),it:itId,start:startTime,a:true})}}else if(conn?.open)conn.send({t:'input',a:{left:!!keys.a,right:!!keys.d,up:!!keys.w,down:!!keys.s}})}draw();requestAnimationFrame(tick)}
function draw(){let sx=W/BW,sy=H/BH,z=Math.min(sx,sy),ox=(W-BW*z)/2,oy=(H-BH*z)/2;g.setTransform(z*D,0,0,z*D,ox*D,oy*D);g.clearRect(0,0,BW,BH);g.fillStyle='#0b1a2b';g.fillRect(0,0,BW,BH);g.strokeStyle='#ffffff0d';for(let x=0;x<BW;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,BH);g.stroke()}for(let y=0;y<BH;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(BW,y);g.stroke()}walls.forEach(o=>{g.fillStyle='#243b55';g.fillRect(o.x,o.y,o.w,o.h);g.strokeStyle='#4b6988';g.strokeRect(o.x,o.y,o.w,o.h)});g.fillStyle='#61e7ff16';g.beginPath();g.arc(700,410,100,0,7);g.fill();g.strokeStyle='#61e7ff55';g.stroke();g.fillStyle='#9fb0c8';g.textAlign='center';g.font='700 13px Arial';g.fillText('POWER ZONE',700,414);Object.values(players).forEach(p=>{let gh=p.ghost>performance.now();g.beginPath();g.arc(p.x,p.y,18,0,7);g.fillStyle=gh?'#ffffff44':p.color;g.fill();if(p.it){g.strokeStyle='#ff506e';g.lineWidth=5;g.stroke()}g.fillStyle='#06121d';g.font='700 11px Arial';g.fillText(clean(p.name),p.x,p.y-25)});if(active){$('time').textContent=Math.max(0,Math.ceil((ROUND-(performance.now()-startTime))/1000));$('it').textContent='IT: '+(players[itId]?.name||'???');$('scores').innerHTML=Object.values(players).map(p=>clean(p.name)+': '+(p.score||0)).join('<br>');let p=players[me];$('ability').textContent='Dash '+(p&&p.dash>performance.now()?'COOLDOWN':'READY')+' • Ghost '+(p&&p.ghost>performance.now()?'ACTIVE':'READY')}}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();if(mode==='practice')ability(players.you,'dash');else if(conn?.open)conn.send({t:'ability',k:'dash'})}if(e.code==='KeyQ'){e.preventDefault();if(mode==='practice')ability(players.you,'ghost');else if(conn?.open)conn.send({t:'ability',k:'ghost'})}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
$('practice').onclick=practice;$('create').onclick=create;$('join').onclick=join;$('start').onclick=startMatch;$('back').onclick=()=>{cleanup();hide('lobby');show('menu')};$('again').onclick=()=>{hide('end');if(mode==='practice'){show('hud');reset()}else if(host){show('lobby');lobby()}};$('menuBtn').onclick=()=>{cleanup();hide('end');show('menu');mode='menu'};tick();})();</script></body></html>
