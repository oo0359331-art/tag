<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POWER TAG</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c;color:#fff;font-family:system-ui,Arial,sans-serif}canvas{width:100%;height:100%;display:block;background:#0a1422}.screen{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,7,14,.88);z-index:10}.panel{width:min(92vw,540px);padding:28px;border:1px solid #ffffff20;border-radius:18px;background:#0d1524f5;box-shadow:0 18px 70px #0008}h1{margin:0 0 8px;font-size:clamp(40px,8vw,72px);letter-spacing:6px}.sub{color:#aebbd3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input,button{width:100%;padding:13px;border-radius:11px;border:1px solid #ffffff20;font:700 14px inherit}input{background:#09101c;color:#fff}button{background:#61e7ff;color:#03131a;cursor:pointer}button.secondary{background:#1b2943;color:#e7efff}.hidden{display:none!important}.code{font-size:30px;font-weight:900;letter-spacing:7px;text-align:center;background:#07111f;color:#61e7ff;padding:12px;border-radius:12px;margin:14px 0}.hud{position:absolute;inset:0;z-index:5;pointer-events:none}.card{background:#040912b0;border:1px solid #ffffff18;border-radius:12px;padding:10px}.left{position:absolute;left:14px;top:14px;width:280px}.right{position:absolute;right:14px;top:14px;width:260px}.label{font-size:10px;letter-spacing:2px;color:#61e7ff;font-weight:900}.value{font-size:18px;font-weight:900}.keys{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:#d4deef;text-shadow:0 2px 8px #000;white-space:nowrap}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;text-shadow:0 4px 20px #000}.center h2{font-size:clamp(38px,8vw,84px);margin:0}.center p{margin:8px}.pop{animation:pop .6s}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}#toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:20;background:#000b;padding:10px 14px;border-radius:10px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.left,.right{width:220px}.keys{white-space:normal;text-align:center;max-width:94vw;font-size:10px}}
</style></head><body><canvas id="game"></canvas><div id="toast"></div>
<div id="menu" class="screen"><div class="panel"><h1>POWER TAG</h1><p class="sub">Fast rounds. Smart bot. Chaos with friends. 😈</p><input id="name" maxlength="14" value="Player" placeholder="Your name"><div style="height:10px"></div><div class="grid"><button id="practice">PRACTICE vs SMART BOT</button><button id="create">CREATE ROOM</button><button id="join">JOIN ROOM</button><input id="room" class="full" maxlength="6" placeholder="Room code, e.g. A7K2QF"></div><p style="color:#91a0bc;font-size:12px">Open two browsers to test multiplayer.</p></div></div>
<div id="lobby" class="screen hidden"><div class="panel" style="text-align:center;max-width:450px"><h2>ROOM READY</h2><p class="sub">Send this code to your friends.</p><div id="roomCode" class="code">------</div><p id="lobbyStatus" style="color:#aebbd3">Waiting...</p><button id="start">START MATCH</button><div style="height:8px"></div><button id="back" class="secondary">BACK</button></div></div>
<div id="hud" class="hud hidden"><div class="left card"><div class="label">MODE</div><div id="mode" class="value">ONLINE</div><div class="label" style="margin-top:8px">STATUS</div><div id="status" class="value" style="font-size:14px">CONNECTING...</div><div class="label" style="margin-top:8px">YOU</div><div id="you" class="value" style="font-size:15px">Player</div><div id="ability" style="color:#a0aec8">Dash READY • Ghost READY</div></div><div class="right card"><div class="label">ROUND</div><div id="time" class="value">90</div><div id="it" style="margin-top:4px">IT: ???</div><div id="scores" style="color:#a0aec8;margin-top:8px"></div></div><div id="center" class="center hidden"><h2 id="ct"></h2><p id="cs"></p></div><div class="keys">WASD • SPACE DASH • Q GHOST</div></div>
<div id="end" class="screen hidden"><div class="panel" style="text-align:center;max-width:500px"><h2 id="endTitle">ROUND OVER</h2><p id="endText" class="sub"></p><div id="endScores" class="card" style="text-align:left;margin:12px 0"></div><button id="again">PLAY AGAIN</button><div style="height:8px"></div><button id="menuBtn" class="secondary">MENU</button></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
(()=>{'use strict';
const c=document.getElementById('game'),g=c.getContext('2d'),BW=1200,BH=700,ROUND=90000,SPEED=250;let W=innerWidth,H=innerHeight,S=1,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);c.width=W*D;c.height=H*D;S=Math.min(W/BW,H/BH);g.setTransform(D*S,0,0,D*S,(W-BW*S)/2,(H-BH*S)/2)}addEventListener('resize',resize);resize();
const $=id=>document.getElementById(id),show=id=>$(id).classList.remove('hidden'),hide=id=>$(id).classList.add('hidden');let mode='menu',peer=null,conn=null,host=false,code='',me='',myName='Player',players={},connections=new Map(),inputs=new Map(),itId=null,startTime=0,active=false,last=performance.now(),lastNet=0;const keys={};const colors=['#61e7ff','#ffd45d','#ff6f8a','#88ff91','#bc9cff','#ffa05e','#6ea7ff','#ff78e8'];const walls=[{x:100,y:110,w:240,h:34},{x:465,y:80,w:270,h:34},{x:850,y:120,w:240,h:34},{x:70,y:300,w:290,h:38},{x:420,y:255,w:360,h:38},{x:870,y:310,w:260,h:38},{x:120,y:520,w:270,h:34},{x:515,y:470,w:190,h:34},{x:815,y:515,w:290,h:34},{x:55,y:180,w:40,h:120},{x:320,y:395,w:40,h:105},{x:760,y:115,w:40,h:110},{x:780,y:438,w:40,h:115}];
function toast(t,ms=1700){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',ms)}function stat(t){$('status').textContent=t}function clean(n){return(String(n||'Player').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,14)||'Player')}function code6(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let r='';for(let i=0;i<6;i++)r+=s[Math.floor(Math.random()*s.length)];return r}function pid(r){return'powertag-'+r.toLowerCase()}function spawn(i){return[[70,70],[1130,70],[70,630],[1130,630],[600,60],[600,640],[420,150],[850,560]][i%8]}function newP(id,n,col,bot=false){const p=spawn(Object.keys(players).length);return{id,name:n,color:col,x:p[0],y:p[1],it:false,score:0,ghost:0,bot,_dash:true,dx:0,dy:0}}function snapshot(){const o={};for(const[id,p]of Object.entries(players))o[id]={id,name:p.name,color:p.color,x:p.x,y:p.y,it:p.it,score:p.score,ghost:p.ghost>performance.now(),bot:p.bot};return o}function blocked(x,y,r=16){if(x<r||x>BW-r||y<r||y>BH-r)return true;for(const o of walls){const cx=Math.max(o.x,Math.min(x,o.x+o.w)),cy=Math.max(o.y,Math.min(y,o.y+o.h));if(Math.hypot(x-cx,y-cy)<r)return true}return false}function move(p,dx,dy){const nx=p.x+dx,ny=p.y+dy;if(!blocked(nx,p.y))p.x=nx;if(!blocked(p.x,ny))p.y=ny}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function broadcast(d){for(const q of connections.values())if(q.open)try{q.send(d)}catch(_){} }function lobby(){const n=Object.keys(players).length;$('lobbyStatus').textContent=`${n}/8 PLAYERS • ${active?'MATCH ACTIVE':'WAITING'}`;$('start').disabled=!host||n<2||active}
function resetRound(){const ids=Object.keys(players);if(!ids.length)return;itId=ids[Math.floor(Math.random()*ids.length)];ids.forEach((id,i)=>{const p=players[id],s=spawn(i);p.x=s[0];p.y=s[1];p.it=id===itId;p.ghost=0;p._dash=true});startTime=performance.now();active=true;center(players[itId]?.name+' IS IT','RUN!',1200);lobby()}
function center(a,b,ms){$('ct').textContent=a;$('cs').textContent=b;show('center');$('center').classList.remove('pop');void $('center').offsetWidth;$('center').classList.add('pop');setTimeout(()=>hide('center'),ms)}
function cleanup(){try{conn?.close()}catch(_){}try{peer?.destroy()}catch(_){}for(const q of connections.values())try{q.close()}catch(_){}conn=null;peer=null;connections.clear();inputs.clear()}
function practice(){cleanup();mode='practice';host=true;myName=clean($('name').value);me='you';players={};players.you=newP('you',myName,colors[0]);players.bot=newP('bot','SMART BOT',colors[2],true);hide('menu');hide('lobby');show('hud');$('mode').textContent='PRACTICE';$('you').textContent=myName;stat('SMART BOT');resetRound()}
function createRoom(){cleanup();mode='online';host=true;code=code6();myName=clean($('name').value);peer=new Peer(pid(code));stat('CREATING ROOM...');peer.on('open',id=>{me=id;players={};players[id]=newP(id,myName,colors[0]);$('roomCode').textContent=code;hide('menu');show('lobby');stat('HOST READY');lobby()});peer.on('connection',hostConn);peer.on('error',()=>{toast('NETWORK ERROR — TRY AGAIN',2500);cleanup();hide('lobby');show('menu')})}
function joinRoom(){cleanup();mode='online';host=false;myName=clean($('name').value);code=String($('room').value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('ENTER A 6 CHARACTER ROOM CODE');return}peer=new Peer();stat('CONNECTING...');peer.on('open',id=>{me=id;conn=peer.connect(pid(code),{reliable:true});conn.on('open',()=>{conn.send({type:'join',name:myName});hide('menu');show('hud');$('mode').textContent='ONLINE';$('you').textContent=myName;stat('CONNECTED • WAITING FOR HOST')});conn.on('data',guestData);conn.on('close',()=>stat('HOST DISCONNECTED'))});peer.on('error',()=>{toast('COULD NOT JOIN ROOM',2500);cleanup()})}
function hostConn(q){if(connections.size>=7){q.on('open',()=>q.send({type:'full'}));return}q.on('open',()=>{connections.set(q.peer,q);players[q.peer]=newP(q.peer,'Player',colors[Object.keys(players).length%colors.length]);q.send({type:'welcome',players:snapshot(),it:itId,start:startTime,active});lobby();broadcast({type:'players',players:snapshot()})});q.on('data',d=>{if(!d)return;if(d.type==='join'){players[q.peer].name=clean(d.name);broadcast({type:'players',players:snapshot()});lobby()}else if(d.type==='input')inputs.set(q.peer,d.input||{})else if(d.type==='ability')ability(players[q.peer],d.kind)});q.on('close',()=>{delete players[q.peer];connections.delete(q.peer);inputs.delete(q.peer);broadcast({type:'players',players:snapshot()});lobby()})}
function guestData(d){if(!d)return;if(d.type==='full'){toast('ROOM FULL');cleanup();hide('hud');show('menu')}else if(d.type==='welcome'){players=d.players||{};itId=d.it;startTime=d.start||0;active=!!d.active;hide('menu');hide('lobby');show('hud');stat('CONNECTED • ROOM '+code)}else if(d.type==='players'){players=d.players||players}else if(d.type==='state'){players=d.players||players;itId=d.it;startTime=d.start||startTime;active=!!d.active}else if(d.type==='round'){players=d.players||players;itId=d.it;startTime=d.start;active=true;center(players[itId]?.name||'PLAYER','IS IT!',900)}else if(d.type==='roundEnd'){players=d.players||players;active=false;results(d.text||'Round over.')}}
function ability(p,k){if(!p||!active)return;const now=performance.now();if(k==='dash'&&p._dash){move(p,(p.dx||1)*130,(p.dy||0)*130);p._dash=false;setTimeout(()=>p._dash=true,1800)}else if(k==='ghost'&&now>p.ghost)p.ghost=now+2800}
function botInput(bot){let t=null,b=1e9;for(const p of Object.values(players)){if(p===bot)continue;if(bot.it){if(p.ghost>performance.now())continue}else if(!p.it)continue;const dd=dist(bot,p);if(dd<b){b=dd;t=p}}if(!t)return{up:true};let dx=t.x-bot.x,dy=t.y-bot.y,d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;if(!bot.it){dx=-dx;dy=-dy}if(blocked(bot.x+dx*50,bot.y+dy*50))[dx,dy]=[-dy,dx];bot.dx=dx;bot.dy=dy;return{left:dx<-.2,right:dx>.2,up:dy<-.2,down:dy>.2}}
function apply(id,dt){const p=players[id];if(!p)return;const a=p.bot?botInput(p):(inputs.get(id)||{});let dx=(a.right?1:0)-(a.left?1:0),dy=(a.down?1:0)-(a.up?1:0),d=Math.hypot(dx,dy)||1;if(dx||dy){dx/=d;dy/=d;p.dx=dx;p.dy=dy;move(p,dx*SPEED*dt,dy*SPEED*dt)}}function tag(){const t=players[itId];if(!t)return;for(const p of Object.values(players)){if(p.id===t.id||p.ghost>performance.now())continue;if(dist(t,p)<31){t.it=false;p.it=true;itId=p.id;p.score++;center(p.name+' IS IT','TAG SOMEONE!',600);return}}}
function startMatch(){if(!host||Object.keys(players).length<2)return;hide('lobby');show('hud');resetRound();broadcast({type:'round',players:snapshot(),it:itId,start:startTime})}function results(text){$('endTitle').textContent='ROUND OVER';$('endText').textContent=text;$('endScores').innerHTML=Object.values(players).sort((a,b)=>b.score-a.score).map(p=>`<div><b>${clean(p.name)}</b> — ${p.score}</div>`).join('');hide('hud');show('end')}function finish(){active=false;const best=Object.values(players).sort((a,b)=>b.score-a.score)[0],text=`${best?best.name:'Player'} got the most tags.`;broadcast({type:'roundEnd',players:snapshot(),text});results(text)}
function update(dt){if(!active)return;if(host){for(const id of Object.keys(players))apply(id,dt);tag();if(performance.now()-startTime>=ROUND)finish();if(performance.now()-lastNet>80){lastNet=performance.now();broadcast({type:'state',players:snapshot(),it:itId,start:startTime,active})}}else if(conn?.open)conn.send({type:'input',input:{left:!!keys.a,right:!!keys.d,up:!!keys.w,down:!!keys.s}})}
function draw(){g.clearRect(0,0,BW,BH);const bg=g.createLinearGradient(0,0,0,BH);bg.addColorStop(0,'#244366');bg.addColorStop(1,'#07111d');g.fillStyle=bg;g.fillRect(0,0,BW,BH);for(const o of walls){g.fillStyle='#273a52';g.fillRect(o.x,o.y,o.w,o.h)}for(const p of Object.values(players)){g.beginPath();g.arc(p.x,p.y,16,0,Math.PI*2);g.fillStyle=p.ghost>performance.now()?'#ffffff55':p.color;g.fill();if(p.it){g.strokeStyle='#ff5d76';g.lineWidth=5;g.stroke()}g.fillStyle='#06121c';g.font='700 11px Arial';g.textAlign='center';g.fillText(p.name,p.x,p.y-23)}if(active){$('time').textContent=Math.max(0,Math.ceil((ROUND-(performance.now()-startTime))/1000));$('it').textContent='IT: '+(players[itId]?.name||'???');$('scores').innerHTML=Object.values(players).map(p=>`${clean(p.name)}: ${p.score}`).join('<br>');$('ability').textContent=`Dash ${players[me]?._dash?'READY':'COOLDOWN'} • Ghost ${players[me]?.ghost>performance.now()?'ACTIVE':'READY'}`}}
function frame(){const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(frame)}addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();if(mode==='practice')ability(players.you,'dash');else if(conn?.open)conn.send({type:'ability',kind:'dash'})}if(e.code==='KeyQ'){if(mode==='practice')ability(players.you,'ghost');else if(conn?.open)conn.send({type:'ability',kind:'ghost'})}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);$('practice').onclick=practice;$('create').onclick=createRoom;$('join').onclick=joinRoom;$('start').onclick=startMatch;$('back').onclick=()=>{cleanup();hide('lobby');show('menu')};$('again').onclick=()=>{hide('end');if(mode==='practice'){show('hud');resetRound()}else if(host){show('lobby');lobby()}};$('menuBtn').onclick=()=>{cleanup();hide('end');show('menu');mode='menu'};frame();})();</script></body></html>
