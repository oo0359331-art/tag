<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>POWER TAG 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07111e;color:white;font:700 15px system-ui}canvas{display:block}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#020713dd;z-index:5}.panel{width:min(92vw,500px);padding:28px;border:1px solid #ffffff22;border-radius:20px;background:#0d1728;box-shadow:0 20px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ffffff22;border-radius:12px;font:inherit}input{background:#07111e;color:white}button{background:#61e7ff;color:#03131a;cursor:pointer}.secondary{background:#1b2943;color:white}.hidden{display:none!important}.full{grid-column:1/-1}.code{font-size:32px;letter-spacing:8px;text-align:center;color:#61e7ff;background:#07111e;padding:12px;border-radius:12px;margin:15px 0}.hud{position:fixed;inset:0;pointer-events:none;z-index:4}.card{position:absolute;top:14px;background:#020713bb;border:1px solid #ffffff18;border-radius:12px;padding:10px}.left{left:14px}.right{right:14px;text-align:right}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-shadow:0 4px 20px #000;text-align:center}.cross{position:fixed;left:50%;top:50%;width:12px;height:12px;margin:-6px}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{width:12px;height:2px;top:5px}.cross:after{width:2px;height:12px;left:5px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<div id=menu class=screen><div class=panel><h1>POWER TAG 3D 🦍</h1><p>Parkour • chase • abilities • multiplayer</p><input id=name maxlength=14 value=Player placeholder="Your name"><div style=height:10px></div><div class=grid><button id=practice>PRACTICE VS BOT</button><button id=create>CREATE ROOM</button><button id=join>JOIN ROOM</button><input id=room class=full maxlength=6 placeholder="ROOM CODE"></div><p style="opacity:.65;font-size:12px">WASD move • mouse look • SPACE dash • Q ghost</p></div></div>
<div id=lobby class="screen hidden"><div class=panel style=text-align:center><h2>ROOM READY</h2><div id=roomCode class=code>------</div><p id=lobbyStatus>1/8 PLAYERS</p><button id=start>START MATCH</button><br><br><button id=back class=secondary>BACK</button></div></div>
<div id=hud class="hud hidden"><div class="card left">POWER TAG 3D<br><small id=status>READY</small><br>YOU: <span id=you>Player</span><br><small id=ability>⚡ DASH READY • 👻 GHOST READY</small></div><div class="card right">TIME: <span id=time>90</span><br><span id=it>IT: ???</span><br><small id=scores></small></div><div id=center class=center></div><div class=cross></div></div>
<div id=end class="screen hidden"><div class=panel style=text-align:center><h2>ROUND OVER</h2><p id=endText></p><div id=endScores></div><br><button id=again>PLAY AGAIN</button><br><br><button id=menuBtn class=secondary>MENU</button></div></div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),N=$('name'),R=$('room');let S,C,G,P,me='',host=false,peer=null,conn=null,cs=new Map(),ps={},keys={},inputs={},mode='',code='',it='',active=false,started=0,lastNet=0;const ROUND=90000,SPEED=7,colors=[0x55ddff,0xffd34d,0xff6688,0x80ff8a,0xb48cff,0xff9b55,0x6ea8ff,0xff70e8],sp=[[-34,-34],[34,-34],[-34,34],[34,34],[-30,0],[30,0],[0,-34],[0,34]],walls=[[-22,-12,16,3,5],[-2,-24,14,3,5],[21,-15,4,16,5],[-22,15,4,16,5],[0,22,20,3,5],[24,18,10,3,5],[-5,0,4,20,5],[14,5,12,3,5]];
function init(){S=new THREE.Scene;S.background=new THREE.Color(0x07111e);S.fog=new THREE.Fog(0x07111e,45,100);C=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);G=new THREE.WebGLRenderer({antialias:true});G.setPixelRatio(Math.min(devicePixelRatio||1,1.5));G.setSize(innerWidth,innerHeight);document.body.appendChild(G.domElement);S.add(new THREE.HemisphereLight(0x99ccff,0x17233a,1.6));let l=new THREE.DirectionalLight(0xffffff,1.6);l.position.set(15,30,10);S.add(l);let f=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x10253a}));f.rotation.x=-Math.PI/2;S.add(f);for(let i=-45;i<=45;i+=5){let a=new THREE.Mesh(new THREE.BoxGeometry(.025,.02,90),new THREE.MeshBasicMaterial({color:0x25425a}));a.position.x=i;a.position.y=.01;S.add(a);let b=new THREE.Mesh(new THREE.BoxGeometry(90,.02,.025),new THREE.MeshBasicMaterial({color:0x25425a}));b.position.z=i;b.position.y=.011;S.add(b)}walls.forEach(w=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w[2],5,w[3]),new THREE.MeshStandardMaterial({color:0x2c4964}));m.position.set(w[0],2.5,w[1]);S.add(m)});let z=new THREE.Mesh(new THREE.CylinderGeometry(7,7,.08,48),new THREE.MeshBasicMaterial({color:0x35d9ff,transparent:true,opacity:.2}));z.position.y=.04;S.add(z);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();G.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space'){e.preventDefault();ability('dash')}if(e.key.toLowerCase()==='q')ability('ghost')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);G.domElement.onclick=()=>active&&G.domElement.requestPointerLock();document.addEventListener('mousemove',e=>{if(document.pointerLockElement===G.domElement){C.rotation.y-=e.movementX*.0025;C.rotation.x=Math.max(-1.2,Math.min(1.2,C.rotation.x-e.movementY*.0025))}});requestAnimationFrame(loop)}
function clean(n){return String(n||'Player').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,14)||'Player'}function rid(x){return'powertag3d-'+x.toLowerCase()}function show(x){$(x).classList.remove('hidden')}function hide(x){$(x).classList.add('hidden')}function say(x){$('center').textContent=x;setTimeout(()=>{if($('center').textContent===x)$('center').textContent=''},900)}function newP(id,n,i,bot){let q=sp[Object.keys(ps).length%sp.length];return{id,name:n,color:colors[i%8],x:q[0],y:1,z:q[1],it:false,score:0,ghost:0,dash:0,bot:!!bot,dx:0,dz:1}}
function avatar(p){let r=new THREE.Group,m=new THREE.MeshStandardMaterial({color:p.color}),b=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),m);b.position.y=1.2;b.scale.y=1.25;r.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.46,16,12),m);h.position.y=2.1;r.add(h);let a=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.9,4,8),m),b2=a.clone();a.position.set(-.7,1.2,0);b2.position.set(.7,1.2,0);a.rotation.z=-.4;b2.rotation.z=.4;r.add(a,b2);return r}
function snap(){let o={};Object.values(ps).forEach(p=>o[p.id]={id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,z:p.z,it:p.it,score:p.score,ghost:p.ghost>performance.now(),bot:p.bot});return o}function load(s){let old=ps;ps={};Object.values(s||{}).forEach(q=>{let p={...q,mesh:old[q.id]?.mesh};p.ghost=q.ghost?performance.now()+2400:0;ps[p.id]=p});drawPlayers()}
function drawPlayers(){Object.values(ps).forEach(p=>{if(!p.mesh){p.mesh=avatar(p);S.add(p.mesh)}p.mesh.position.set(p.x,p.y-1,p.z);p.mesh.visible=p.ghost<=performance.now();p.mesh.children.forEach(o=>o.material?.color?.setHex(p.it?0xff6677:p.color))})}
function blocked(x,z){if(x<-40||x>40||z<-40||z>40)return 1;for(let w of walls)if(Math.abs(x-w[0])<w[2]/2+.7&&Math.abs(z-w[1])<w[3]/2+.7)return 1;return 0}function move(p,x,z){if(!blocked(p.x+x,p.z))p.x+=x;if(!blocked(p.x,p.z+z))p.z+=z}
function reset(){let ids=Object.keys(ps);if(ids.length<2)return;it=ids[Math.floor(Math.random()*ids.length)];ids.forEach((id,i)=>{let p=ps[id],q=sp[i%sp.length];p.x=q[0];p.z=q[1];p.y=1;p.it=id===it;p.score=0;p.ghost=0;p.dash=0});started=performance.now();active=true;say((ps[it]?.name||'PLAYER')+' IS IT!');drawPlayers()}
function ability(k,id=me){let p=ps[id];if(!p||!active)return;let n=performance.now();if(k==='dash'&&n>p.dash){let dx=p.dx||Math.sin(C.rotation.y),dz=p.dz||Math.cos(C.rotation.y);move(p,dx*5,dz*5);p.dash=n+1800;if(id===me)say('⚡ DASH!')}if(k==='ghost'&&n>p.ghost){p.ghost=n+3000;if(id===me)say('👻 GHOST!')}}
function create(){cleanup();host=true;mode='online';code='';for(let i=0;i<6;i++)code+='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)];peer=new Peer(rid(code));peer.on('open',id=>{me=id;ps={};ps[id]=newP(id,clean(N.value),0);$('roomCode').textContent=code;hide('menu');show('lobby');lobby()});peer.on('connection',hc);peer.on('error',()=>{cleanup();hide('lobby');show('menu');say('ROOM ERROR')})}
function join(){cleanup();host=false;mode='online';code=R.value.toUpperCase().trim();if(!/^[A-Z0-9]{6}$/.test(code)){say('ENTER 6 CHAR CODE');return}peer=new Peer;peer.on('open',id=>{me=id;conn=peer.connect(rid(code),{reliable:true});conn.on('open',()=>{conn.send({t:'join',name:clean(N.value)});hide('menu');show('hud');$('you').textContent=clean(N.value);G.domElement.requestPointerLock()});conn.on('data',gd);conn.on('close',()=>say('HOST LEFT'))});peer.on('error',()=>say('COULD NOT JOIN'))}
function hc(c){if(cs.size>=7){c.on('open',()=>c.send({t:'full'}));return}c.on('open',()=>{cs.set(c.peer,c);ps[c.peer]=newP(c.peer,'Player',Object.keys(ps).length);c.send({t:'welcome',p:snap(),it,start:started,a:active});lobby()});c.on('data',d=>{if(d.t==='join'&&ps[c.peer]){ps[c.peer].name=clean(d.name);broadcast({t:'players',p:snap()});lobby()}else if(d.t==='input')inputs[c.peer]=d.a||{};else if(d.t==='ability')ability(d.k,c.peer)});c.on('close',()=>{delete ps[c.peer];cs.delete(c.peer);delete inputs[c.peer];broadcast({t:'players',p:snap()});lobby()})}
function gd(d){if(d.t==='full'){say('ROOM FULL');cleanup();hide('hud');show('menu')}else if(d.t==='welcome'){load(d.p);it=d.it;started=d.start;active=d.a}else if(d.t==='players')load(d.p);else if(d.t==='state'){load(d.p);it=d.it;started=d.start;active=d.a}else if(d.t==='round'){load(d.p);it=d.it;started=d.start;active=true}else if(d.t==='end'){load(d.p);active=false;end(d.text)}}function broadcast(d){cs.forEach(c=>{if(c.open)c.send(d)})}
function lobby(){let n=Object.keys(ps).length;$('lobbyStatus').textContent=n+'/8 PLAYERS';$('start').disabled=!host||n<2||active}
function practice(){cleanup();host=true;mode='practice';me='you';ps={};ps.you=newP('you',clean(N.value),0);ps.bot=newP('bot','SMART BOT',2,true);hide('menu');show('hud');$('you').textContent=ps.you.name;reset();G.domElement.requestPointerLock()}
function cleanup(){try{conn?.close()}catch(e){}try{peer?.destroy()}catch(e){}cs.forEach(c=>c.close());cs.clear();inputs={};conn=null;peer=null}
function hostTick(){Object.values(ps).forEach(p=>{let a=p.id===me?keys:(p.bot?null:inputs[p.id]||{});if(p.bot){let t=Object.values(ps).find(q=>q!==p&&(p.it?!q.it:q.it));if(t){let x=t.x-p.x,z=t.z-p.z,d=Math.hypot(x,z)||1;if(!p.it){x=-x;z=-z}p.dx=x/d;p.dz=z/d;move(p,p.dx*SPEED/60,p.dz*SPEED/60)}}else if(a){let x=(a.d?1:0)-(a.a?1:0),z=(a.s?1:0)-(a.w?1:0),d=Math.hypot(x,z);if(d){x/=d;z/=d;let y=C.rotation.y,wx=x*Math.cos(y)-z*Math.sin(y),wz=x*Math.sin(y)+z*Math.cos(y);p.dx=wx;p.dz=wz;move(p,wx*SPEED/60,wz*SPEED/60)}}});let t=ps[it];if(t)Object.values(ps).forEach(p=>{if(p!==t&&p.ghost<=performance.now()&&Math.hypot(t.x-p.x,t.z-p.z)<1.7){t.it=false;p.it=true;it=p.id;p.score++;say(p.name+' IS IT!')}});let n=performance.now();if(n-started>=ROUND){active=false;let best=Object.values(ps).sort((a,b)=>b.score-a.score)[0],text=(best?.name||'Player')+' got the most tags.';broadcast({t:'end',p:snap(),text});end(text)}else if(n-lastNet>70){lastNet=n;broadcast({t:'state',p:snap(),it,start:started,a:true})}}
function guestTick(){let p=ps[me];if(!p)return;let x=(keys.d?1:0)-(keys.a?1:0),z=(keys.s?1:0)-(keys.w?1:0),d=Math.hypot(x,z);if(d){x/=d;z/=d;let y=C.rotation.y,wx=x*Math.cos(y)-z*Math.sin(y),wz=x*Math.sin(y)+z*Math.cos(y);p.dx=wx;p.dz=wz;move(p,wx*SPEED/60,wz*SPEED/60)}if(conn?.open)conn.send({t:'input',a:{w:!!keys.w,a:!!keys.a,s:!!keys.s,d:!!keys.d}})}
function end(text){hide('hud');show('end');$('endText').textContent=text;$('endScores').innerHTML=Object.values(ps).map(p=>'<div>'+clean(p.name)+' — '+p.score+' tags</div>').join('')}
function loop(){if(active){if(host)hostTick();else guestTick()}drawPlayers();if(ps[me]){C.position.set(ps[me].x,2.3,ps[me].z);$('time').textContent=Math.max(0,Math.ceil((ROUND-(performance.now()-started))/1000));$('it').textContent='IT: '+(ps[it]?.name||'???');$('scores').textContent=Object.values(ps).map(p=>p.name+':'+p.score).join(' • ');let n=performance.now(),p=ps[me];$('ability').textContent=(n>p.dash?'⚡ DASH READY':'⚡ DASH '+((p.dash-n)/1000).toFixed(1)+'s')+' • '+(n>p.ghost?'👻 GHOST READY':'👻 GHOST '+((p.ghost-n)/1000).toFixed(1)+'s')}G.render(S,C);requestAnimationFrame(loop)}
$('practice').onclick=practice;$('create').onclick=create;$('join').onclick=join;$('start').onclick=()=>{if(host&&Object.keys(ps).length>=2){hide('lobby');show('hud');reset();broadcast({t:'round',p:snap(),it,start:started})}};$('back').onclick=()=>{cleanup();hide('lobby');show('menu')};$('again').onclick=()=>{hide('end');show('hud');if(host)reset()};$('menuBtn').onclick=()=>{cleanup();active=false;hide('end');hide('hud');show('menu');document.exitPointerLock?.()};init()})();</script></body></html>
