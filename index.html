<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Power Tag 🦍</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}canvas{display:block}.screen{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#07140dcc,#000b);z-index:10}.panel{width:min(92vw,520px);padding:30px;border-radius:24px;background:#17251cdd;border:2px solid #ffffff20;box-shadow:0 20px 80px #000;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,input{box-sizing:border-box;width:100%;padding:15px;border:0;border-radius:14px;font:inherit}button{background:#62e66d;color:#08200b;cursor:pointer}button:hover{filter:brightness(1.1)}.secondary{background:#304336;color:#fff}.full{grid-column:1/-1}input{background:#0b1510;color:#fff;border:1px solid #ffffff22}.hidden{display:none!important}.hud{position:fixed;inset:0;z-index:5;pointer-events:none}.card{position:absolute;top:14px;background:#07100bd9;border:1px solid #ffffff22;border-radius:14px;padding:11px}.left{left:14px}.right{right:14px;text-align:right}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px;text-align:center;text-shadow:0 4px 18px #000}.cross{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px}.cross:before,.cross:after{content:"";position:absolute;background:white}.cross:before{width:12px;height:2px;top:5px}.cross:after{width:2px;height:12px;left:5px}</style></head><body><div id=menu class=screen><div class=panel><h1>POWER TAG 🦍</h1><p>Gorilla-style 3D tag: run, jump, climb-ish parkour and use powers.</p><input id=name value=Player maxlength=14><div style=height:12px></div><div class=grid><button id=practice>PRACTICE VS BOT</button><button id=create>CREATE ROOM</button><button id=join>JOIN ROOM</button><input id=room class=full maxlength=6 placeholder="ROOM CODE"></div><p style="opacity:.7;font-size:13px">WASD = move • mouse = look • SPACE = jump • SHIFT = arm dash • Q = ghost • click = lock mouse</p></div></div><div id=lobby class="screen hidden"><div class=panel style=text-align:center><h2>ROOM</h2><div id=roomCode style="font-size:34px;letter-spacing:8px;color:#62e66d;margin:16px">------</div><p id=lobbyStatus>1/8 PLAYERS</p><button id=start>START</button><br><br><button id=back class=secondary>BACK</button></div></div><div id=hud class="hud hidden"><div class="card left">POWER TAG 🦍<br><small id=status>READY</small><br><span id=you>Player</span><br><small>⚡ DASH <span id=dashState>READY</span> • 👻 GHOST <span id=ghostState>READY</span></small></div><div class="card right">TIME <span id=time>90</span><br><span id=it>IT: ???</span><br><small id=scores></small></div><div id=center class=center></div><div class=cross></div></div><div id=end class="screen hidden"><div class=panel style=text-align:center><h2>ROUND OVER</h2><p id=endText></p><div id=endScores></div><button id=again>PLAY AGAIN</button><br><br><button id=menuBtn class=secondary>MENU</button></div></div><script src=https://unpkg.com/three@0.128.0/build/three.min.js></script><script src=https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js></script><script>(function(){const $=x=>document.getElementById(x);let scene,camera,renderer,peer,hostConn,host=false,online=false,room='',me='';let conns=new Map(),players={},inputs={},keys={};let active=false,startTime=0,lastBroadcast=0,lastFrame=performance.now();const SPEED=9,GRAVITY=22,JUMP=9,ROUND=90000;const spawn=[[-15,0,-15],[15,0,-15],[-15,0,15],[15,0,15],[-18,0,0],[18,0,0],[0,0,-18],[0,0,18]];const cols=[0x61e66d,0xff6b6b,0x58b8ff,0xffd34e,0xc783ff,0xff8f52,0x61e6d2,0xff70b7];const rocks=[];function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x8bcf91);scene.fog=new THREE.Fog(0x8bcf91,35,85);camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,140);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdffff0,0x244025,1.8));let sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(-20,35,10);scene.add(sun);let ground=new THREE.Mesh(new THREE.PlaneGeometry(110,110),new THREE.MeshStandardMaterial({color:0x3b7138,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);for(let i=-50;i<=50;i+=5){let l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i,.01,-50),new THREE.Vector3(i,.01,50)]),new THREE.LineBasicMaterial({color:0x50854c,transparent:true,opacity:.3}));scene.add(l);let l2=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-50,.012,i),new THREE.Vector3(50,.012,i)]),new THREE.LineBasicMaterial({color:0x50854c,transparent:true,opacity:.3}));scene.add(l2)}for(let i=0;i<24;i++){let x=(Math.random()-.5)*80,z=(Math.random()-.5)*80;let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.7,5,8),new THREE.MeshStandardMaterial({color:0x68452b}));trunk.position.set(x,2.5,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,10,8),new THREE.MeshStandardMaterial({color:0x245d2b}));crown.position.set(x,6,z);scene.add(crown)}const obs=[[0,3,0,5,3,5],[-11,1.5,0,4,3,8],[11,1.5,0,4,3,8],[0,2,-13,9,4,3],[0,2,13,9,4,3],[-18,2,-18,6,4,6],[18,2,18,6,4,6]];obs.forEach(a=>{let m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),new THREE.MeshStandardMaterial({color:0x765637,roughness:1}));m.position.set(a[0],a[1],a[2]);scene.add(m);rocks.push({x:a[0],z:a[2],w:a[3],h:a[5]})});let ring=new THREE.Mesh(new THREE.TorusGeometry(5,.12,8,48),new THREE.MeshBasicMaterial({color:0xfff27a}));ring.rotation.x=Math.PI/2;ring.position.y=.06;scene.add(ring);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys[e.code]=1;keys[e.key.toLowerCase()]=1;if(e.code==='Space')e.preventDefault();if(e.code==='ShiftLeft'||e.code==='ShiftRight')ability('dash');if(e.key.toLowerCase()==='q')ability('ghost')});addEventListener('keyup',e=>{keys[e.code]=0;keys[e.key.toLowerCase()]=0});renderer.domElement.addEventListener('click',()=>{if(active)renderer.domElement.requestPointerLock()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){camera.rotation.y-=e.movementX*.0024;camera.rotation.x=Math.max(-1.15,Math.min(1.15,camera.rotation.x-e.movementY*.0024))}});requestAnimationFrame(loop)}function clean(n){return(String(n||'Player').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,14)||'Player')}function idFor(c){return'powertag-'+c.toLowerCase()}function tell(t){$('center').textContent=t;setTimeout(()=>{$('center').textContent=t&&$('center').textContent===t?'':$('center').textContent},1000)}function newPlayer(id,name,i,bot){let s=spawn[Object.keys(players).length%spawn.length];return{id,name,color:cols[i%cols.length],x:s[0],y:1.2,z:s[2],vy:0,it:false,score:0,ghost:0,dash:0,bot:!!bot,dx:0,dz:1}}function makeAvatar(p){let g=new THREE.Group();let mat=new THREE.MeshStandardMaterial({color:p.color});let body=new THREE.Mesh(new THREE.SphereGeometry(.75,16,12),mat);body.scale.y=1.25;body.position.y=1.15;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.5,16,12),mat);head.position.y=2.15;g.add(head);let arm1=new THREE.Mesh(new THREE.CapsuleGeometry(.18,.9,4,8),mat),arm2=arm1.clone();arm1.position.set(-.75,1.15,0);arm2.position.set(.75,1.15,0);arm1.rotation.z=-.5;arm2.rotation.z=.5;g.add(arm1,arm2);let eyeMat=new THREE.MeshBasicMaterial({color:0x111111});for(let x of [-.18,.18]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),eyeMat);eye.position.set(x,2.25,-.45);g.add(eye)}return g}function draw(){Object.values(players).forEach(p=>{if(!p.mesh){p.mesh=makeAvatar(p);scene.add(p.mesh)}p.mesh.position.set(p.x,p.y-1.2,p.z);p.mesh.visible=p.ghost<=performance.now();p.mesh.children.forEach(o=>{if(o.material&&o.material.color)o.material.color.setHex(p.it?0xff3d55:p.color)})})}function blocked(x,z){if(x<-48||x>48||z<-48||z>48)return true;for(let r of rocks)if(Math.abs(x-r.x)<r.w/2+.65&&Math.abs(z-r.z)<r.h/2+.65)return true;return false}function move(p,dx,dz){if(!blocked(p.x+dx,p.z))p.x+=dx;if(!blocked(p.x,p.z+dz))p.z+=dz}function physics(p,dt){p.vy-=GRAVITY*dt;p.y+=p.vy*dt;if(p.y<1.2){p.y=1.2;p.vy=0}}function ability(k,id=me){let p=players[id];if(!p||!active)return;let n=performance.now();if(k==='dash'&&n>=p.dash){let dx=p.dx||Math.sin(camera.rotation.y),dz=p.dz||Math.cos(camera.rotation.y);move(p,dx*5,dz*5);p.dash=n+1600;if(!host&&online&&hostConn?.open)hostConn.send({t:'ability',k:'dash'});tell('⚡ ARM DASH!')}if(k==='ghost'&&n>=p.ghost){p.ghost=n+3000;if(!host&&online&&hostConn?.open)hostConn.send({t:'ability',k:'ghost'});tell('👻 GHOST!')}}function resetRound(){let ids=Object.keys(players);if(ids.length<2)return;ids.forEach((id,i)=>{let p=players[id],s=spawn[i%spawn.length];p.x=s[0];p.z=s[2];p.y=1.2;p.vy=0;p.it=false;p.score=0;p.ghost=0;p.dash=0});me&& (players[me].it=true);let itId=ids[Math.floor(Math.random()*ids.length)];Object.values(players).forEach(p=>p.it=p.id===itId);startTime=performance.now();active=true;draw();tell(players[itId].name+' IS IT!')}function hostTick(dt){Object.values(players).forEach(p=>{let a=p.id===me?keys:inputs[p.id]||{};if(p.bot){let target=Object.values(players).find(q=>q!==p&&(p.it?!q.it:q.it));if(target){let dx=target.x-p.x,dz=target.z-p.z,d=Math.hypot(dx,dz)||1;if(!p.it){dx=-dx;dz=-dz}p.dx=dx/d;p.dz=dz/d;move(p,p.dx*SPEED*dt,p.dz*SPEED*dt)}}else{let x=(a.KeyD?1:0)-(a.KeyA?1:0),z=(a.KeyS?1:0)-(a.KeyW?1:0),d=Math.hypot(x,z);if(d){x/=d;z/=d;let y=camera.rotation.y,wx=x*Math.cos(y)-z*Math.sin(y),wz=x*Math.sin(y)+z*Math.cos(y);p.dx=wx;p.dz=wz;move(p,wx*SPEED*dt,wz*SPEED*dt)}}if(a.Space&&p.y<=1.21){p.vy=JUMP;a.Space=0}});let current=players[Object.keys(players).find(id=>players[id].it)];if(current)Object.values(players).forEach(p=>{if(p!==current&&p.ghost<=performance.now()&&Math.hypot(current.x-p.x,current.z-p.z)<1.7){current.it=false;p.it=true;p.score++;tell(p.name+' IS IT!')}});let now=performance.now();if(now-startTime>=ROUND){active=false;let best=Object.values(players).sort((a,b)=>b.score-a.score)[0];broadcast({t:'end',p:snap(),text:best.name+' got '+best.score+' tags.'});finish(best.name+' got '+best.score+' tags.')}else if(now-lastBroadcast>70){lastBroadcast=now;broadcast({t:'state',p:snap(),start:startTime,a:true})}}function guestTick(dt){let p=players[me];if(!p)return;let x=(keys.KeyD?1:0)-(keys.KeyA?1:0),z=(keys.KeyS?1:0)-(keys.KeyW?1:0),d=Math.hypot(x,z);if(d){x/=d;z/=d;let y=camera.rotation.y,wx=x*Math.cos(y)-z*Math.sin(y),wz=x*Math.sin(y)+z*Math.cos(y);p.dx=wx;p.dz=wz;move(p,wx*SPEED*dt,wz*SPEED*dt)}if(keys.Space&&p.y<=1.21){p.vy=JUMP;keys.Space=0}if(hostConn?.open)hostConn.send({t:'input',a:{KeyW:!!keys.KeyW,KeyA:!!keys.KeyA,KeyS:!!keys.KeyS,KeyD:!!keys.KeyD,Space:!!keys.Space}})}function snap(){let o={};Object.values(players).forEach(p=>o[p.id]={id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,z:p.z,it:p.it,score:p.score,ghost:p.ghost>performance.now(),bot:p.bot});return o}function load(s){let old=players;players={};Object.values(s||{}).forEach(q=>{players[q.id]={...q,vy:old[q.id]?.vy||0,mesh:old[q.id]?.mesh};players[q.id].ghost=q.ghost?performance.now()+1500:0});draw()}function broadcast(d){conns.forEach(c=>{if(c.open)c.send(d)})}function create(){cleanup();host=true;online=true;room='';const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<6;i++)room+=chars[Math.floor(Math.random()*chars.length)];peer=new Peer(idFor(room));peer.on('open',id=>{me=id;players={};players[id]=newPlayer(id,clean($('name').value),0);$('roomCode').textContent=room;hide('menu');show('lobby');lobby()});peer.on('connection',c=>{if(conns.size>=7){c.on('open',()=>c.send({t:'full'}));return}c.on('open',()=>{conns.set(c.peer,c);players[c.peer]=newPlayer(c.peer,'Player',Object.keys(players).length);c.send({t:'welcome',p:snap()});lobby()});c.on('data',d=>{if(d.t==='join'){players[c.peer].name=clean(d.name);broadcast({t:'state',p:snap(),start:startTime,a:active});lobby()}if(d.t==='input')inputs[c.peer]=d.a||{};if(d.t==='ability')ability(d.k,c.peer)});c.on('close',()=>{delete players[c.peer];conns.delete(c.peer);delete inputs[c.peer];lobby()})})}function join(){cleanup();host=false;online=true;room=$('room').value.toUpperCase().trim();if(!/^[A-Z0-9]{6}$/.test(room)){tell('ENTER 6 CHAR ROOM');return}peer=new Peer();peer.on('open',id=>{me=id;hostConn=peer.connect(idFor(room));hostConn.on('open',()=>{hostConn.send({t:'join',name:clean($('name').value)});hide('menu');show('hud');$('you').textContent=clean($('name').value);renderer.domElement.requestPointerLock()});hostConn.on('data',d=>{if(d.t==='full'){tell('ROOM FULL');return}if(d.t==='welcome'||d.t==='state'){load(d.p);if(d.start)startTime=d.start;active=!!d.a}if(d.t==='end'){load(d.p);finish(d.text)}});hostConn.on('close',()=>tell('HOST LEFT'))})}function lobby(){$('lobbyStatus').textContent=Object.keys(players).length+'/8 PLAYERS';$('start').disabled=!host||Object.keys(players).length<2||active}function practice(){cleanup();host=true;online=false;me='you';players={you:newPlayer('you',clean($('name').value),0),bot:newPlayer('bot','SMART BOT',1,true)};hide('menu');show('hud');$('you').textContent=players.you.name;resetRound();renderer.domElement.requestPointerLock()}function start(){if(host){hide('lobby');show('hud');$('you').textContent=players[me].name;resetRound();renderer.domElement.requestPointerLock();broadcast({t:'state',p:snap(),start:startTime,a:true})}}function finish(text){active=false;$('endText').textContent=text;hide('hud');show('end');document.exitPointerLock?.()}function cleanup(){try{hostConn?.close()}catch(e){}try{peer?.destroy()}catch(e){}conns.forEach(c=>c.close());conns.clear();players={};inputs={};hostConn=null;peer=null;active=false}function loop(){let now=performance.now(),dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;if(active){if(host)hostTick(dt);else guestTick(dt);Object.values(players).forEach(p=>physics(p,dt));draw();let p=players[me];if(p){camera.position.set(p.x,p.y+1.0,p.z);$('time').textContent=Math.max(0,Math.ceil((ROUND-(now-startTime))/1000));$('it').textContent='IT: '+(Object.values(players).find(q=>q.it)?.name||'?');$('scores').textContent=Object.values(players).map(q=>q.name+':'+q.score).join(' • ');$('dashState').textContent=performance.now()>=p.dash?'READY':'COOLDOWN';$('ghostState').textContent=performance.now()>=p.ghost?'READY':'ACTIVE'}}}renderer.render(scene,camera);requestAnimationFrame(loop)}$('practice').onclick=practice;$('create').onclick=create;$('join').onclick=join;$('start').onclick=start;$('back').onclick=()=>{cleanup();hide('lobby');show('menu')};$('again').onclick=()=>{hide('end');show('hud');resetRound();renderer.domElement.requestPointerLock()};$('menuBtn').onclick=()=>{cleanup();hide('end');show('menu')};init()})();</script></body></html>
